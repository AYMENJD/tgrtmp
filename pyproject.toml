[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tgrtmp"
dynamic = ["version"]
description = "High-performance RTMP(S) publishing client for Telegram livestreams"
readme = "README.md"
authors = [{ name = "AYMEN", email = "let.me.code.safe@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "rtmp",
    "rtmps",
    "telegram",
    "livestream",
    "publishing",
    "native",
    "high-performance",
    "prebuilt-binaries",
    "linux",
    "windows",
    "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Video",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.urls]
Source = "https://github.com/AYMENJD/tgrtmp"
Tracker = "https://github.com/AYMENJD/tgrtmp/issues"
Documentation = "https://tgrtmp.pages.dev"

[project.optional-dependencies]
docs = [
    "properdocs>=1.6.7",
    "mkdocs-material",
    "mkdocs-autorefs",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[tool.scikit-build]
wheel.packages = ["tgrtmp"]
build-dir = "build/{wheel_tag}"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "tgrtmp/_version.py"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
build-verbosity = 1
skip = "*musllinux*"
archs = ["native"]

[tool.cibuildwheel.linux]
before-all = "bash .github/workflows/scripts/before-all-linux-64.sh"
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
environment = { CMAKE_ARGS = "-DOPENSSL_ROOT_DIR=/usr/local" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
